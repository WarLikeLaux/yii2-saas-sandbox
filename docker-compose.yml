services:
  nginx:
    image: nginx:1.27-alpine
    container_name: saas-nginx
    ports:
      - '8000:80'
    volumes:
      - ./:/app:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: saas-php
    volumes:
      - ./:/app:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: yii2basic
      DB_USER: yii2
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    # Жёсткий лимит соединений для демонстрации исчерпания без пула (PgBouncer)
    command: ['postgres', '-c', 'max_connections=5']
    environment:
      POSTGRES_DB: yii2basic
      POSTGRES_USER: yii2
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yii2 -d yii2basic']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: saas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
